version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      python-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      frontend-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
