name: Finalize release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync release tooling
        run: uv sync --frozen

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve and validate release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          version="${RELEASE_BRANCH#release/v}"
          current_version="$(uv run --frozen cz version -p)"
          declared_version="$(tr -d '[:space:]' < VERSION)"

          if [[ -z "$version" || "$version" == "$RELEASE_BRANCH" ]]; then
            echo "Unable to resolve release version from $RELEASE_BRANCH" >&2
            exit 1
          fi

          if [[ "$version" != "$current_version" || "$version" != "$declared_version" ]]; then
            echo "Release branch version does not match the project version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 0
          fi

          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
