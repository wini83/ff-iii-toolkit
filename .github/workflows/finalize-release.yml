name: Finalize release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release pull request number to finalize (for example 158)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-release-${{ github.event.pull_request.number || inputs.release_pr }}
  cancel-in-progress: false

jobs:
  finalize-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve merged release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.pull_request.number || inputs.release_pr }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected a release pull request number." >&2
            exit 1
          fi

          release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          if ! jq -e '
            .merged == true and
            .base.ref == "main" and
            .head.repo.full_name == env.GITHUB_REPOSITORY and
            (.head.ref | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.merge_commit_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$release_pr" >/dev/null; then
            echo "Expected a merged release/v<version> PR from this repository into main." >&2
            exit 1
          fi

          echo "sha=$(jq -r .merge_commit_sha <<< "$release_pr")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head.ref <<< "$release_pr")" >> "$GITHUB_OUTPUT"

      - name: Checkout release merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync release tooling
        run: uv sync --frozen

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve and validate release version
        id: version
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        shell: bash
        run: |
          version="${RELEASE_BRANCH#release/v}"
          current_version="$(uv run --frozen cz version -p)"
          declared_version="$(tr -d '[:space:]' < VERSION)"

          if [[ -z "$version" || "$version" == "$RELEASE_BRANCH" ]]; then
            echo "Unable to resolve release version from $RELEASE_BRANCH" >&2
            exit 1
          fi

          if [[ "$version" != "$current_version" || "$version" != "$declared_version" ]]; then
            echo "Release branch version does not match the project version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python scripts/extract_release_notes.py
          "v${RELEASE_VERSION}"
          release-notes.md

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            if [[ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $tag already points to a different commit; refusing to reuse it." >&2
              exit 1
            fi
            echo "Tag $tag already exists at the release merge commit."
            exit 0
          fi

          if [[ -z "$GH_TOKEN" ]]; then
            echo "Set the RELEASE_TOKEN repository secret with Contents and Workflows read/write permissions." >&2
            exit 1
          fi

          git tag -a "$tag" -m "$tag"
          # Use the release credential only for this push, without persisting it.
          git -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push origin "refs/tags/${tag}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --notes-file release-notes.md
          fi
