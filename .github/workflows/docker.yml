name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/**"
      - "compose.yaml"
      - "deploy/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/**"
      - "compose.yaml"
      - "deploy/**"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production gateway configuration
        run: >-
          docker run --rm
          --add-host backend:127.0.0.1
          --add-host frontend:127.0.0.1
          --volume "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
