name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/**"
      - "compose.yaml"
      - "Makefile"
      - "deploy/**"
      - "scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/**"
      - "compose.yaml"
      - "Makefile"
      - "deploy/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis_oom:
        image: redis:8.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_OOM_URL: redis://127.0.0.1:6380/0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run pytest
