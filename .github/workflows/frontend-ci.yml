name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/**"
      - "compose.yaml"
      - "Makefile"
      - "deploy/**"
      - "scripts/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/**"
      - "compose.yaml"
      - "Makefile"
      - "deploy/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:matching
      - name: Report matching browser diagnostics
        if: failure()
        run: |
          for context in test-results/*/error-context.md; do
            if [ -f "$context" ]; then
              cat "$context"
              break
            fi
          done

      - name: Upload browser checks and theme screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-checks
          path: frontend/test-results/
          retention-days: 7
