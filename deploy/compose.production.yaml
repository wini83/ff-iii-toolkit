services:
  backend:
    image: ghcr.io/wini83/ff-iii-toolkit-backend:${FF_III_TOOLKIT_VERSION:?Set FF_III_TOOLKIT_VERSION in deploy/.env}
    env_file:
      - ./backend.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    image: ghcr.io/wini83/ff-iii-toolkit-frontend:${FF_III_TOOLKIT_VERSION:?Set FF_III_TOOLKIT_VERSION in deploy/.env}
    environment:
      INTERNAL_API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  backend-data:
