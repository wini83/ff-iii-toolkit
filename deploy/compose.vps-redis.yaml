# Overlay for the existing VPS docker-compose.yml (ff-iii-toolkit-api).
services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - redis_private
  ff-iii-toolkit-api:
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - firefly_net
      - redis_private

networks:
  redis_private:
    internal: true
